on:
  workflow_dispatch:
  push:
    tags:
    - '2*'

name: Release

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    container:
      image: almalinux:8
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Install build prerequisites
        run: |
          dnf update -y
          dnf module enable -y nodejs:20
          dnf install -y python3.11 python3.11-pip git tar gzip which findutils nodejs wget
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pkg
        run: ./_build.sh
      - name: Validate artifacts and get the version
        id: get_version
        run: |
          python3.11 - <<'PY'
          import configparser
          import os
          from pathlib import Path

          config = configparser.ConfigParser()
          config.read('project.ini')
          for name in config.get('blobs', 'Files').split(','):
              artifact = Path('blobs') / name.strip()
              if not artifact.is_file() or artifact.stat().st_size == 0:
                  raise RuntimeError(f'Missing or empty release artifact: {artifact}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('VERSION=' + config.get('project', 'version') + '\n')
          PY
      - name: Upload build artifacts
        # v5+ is incompatible with act's artifact server used by docker-package.sh (nektos/act#6022).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          if-no-files-found: error
          path: |
            blobs/cyclecloud-pbspro-pkg-${{ steps.get_version.outputs.VERSION }}.tar.gz
            blobs/hwloc-libs-1.11.9-3.el8.x86_64.rpm
            blobs/openpbs-client-20.0.1-0.x86_64.rpm
            blobs/openpbs-client-22.05.11-0.x86_64.rpm
            blobs/openpbs-execution-20.0.1-0.x86_64.rpm
            blobs/openpbs-execution-22.05.11-0.x86_64.rpm
            blobs/openpbs-server-20.0.1-0.x86_64.rpm
            blobs/openpbs-server-22.05.11-0.x86_64.rpm
            blobs/pbspro-client-18.1.4-0.x86_64.rpm
            blobs/pbspro-debuginfo-18.1.4-0.x86_64.rpm
            blobs/pbspro-execution-18.1.4-0.x86_64.rpm
            blobs/pbspro-server-18.1.4-0.x86_64.rpm

  publish:
    name: Publish prerelease
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/2')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Assert tag matches project.ini version
        env:
          PROJECT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "ERROR: tag '$TAG_VERSION' does not match project.ini version '$PROJECT_VERSION'"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: blobs
      - name: Create Release and Upload Assets
        if: ${{ env.ACT != 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: blobs/*

