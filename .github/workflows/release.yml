on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - '2*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Upload Release Asset

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build pkg
        run: |
          sudo apt update || apt update
          sudo apt-get install -y python3 python3-pip || apt-get install -y python3 python3-pip
          ./build.sh
      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Assert tag matches project.ini version
        run: |
          PROJECT_VERSION=$(grep -m1 '^version' project.ini | cut -d'=' -f2 | tr -d ' ')
          TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "ERROR: tag '$TAG_VERSION' does not match project.ini version '$PROJECT_VERSION'"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            blobs/cyclecloud-pbspro-pkg-${{ steps.get_version.outputs.VERSION }}.tar.gz
            blobs/cyclecloud_api-8.3.1-py2.py3-none-any.whl
            blobs/hwloc-libs-1.11.9-3.el8.x86_64.rpm
            blobs/openpbs-client-20.0.1-0.x86_64.rpm
            blobs/openpbs-client-22.05.11-0.x86_64.rpm
            blobs/openpbs-execution-20.0.1-0.x86_64.rpm
            blobs/openpbs-execution-22.05.11-0.x86_64.rpm
            blobs/openpbs-server-20.0.1-0.x86_64.rpm
            blobs/openpbs-server-22.05.11-0.x86_64.rpm
            blobs/pbspro-client-18.1.4-0.x86_64.rpm
            blobs/pbspro-debuginfo-18.1.4-0.x86_64.rpm
            blobs/pbspro-execution-18.1.4-0.x86_64.rpm
            blobs/pbspro-server-18.1.4-0.x86_64.rpm

